<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FreeFire AI Sensitivity Lab</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<section id="intro" class="screen">
  <div class="orb"></div>
  <div class="content">
    <p class="eyebrow">AI SENSITIVITY LAB</p>
    <h1>FreeFire AI</h1>
    <p class="sub">Smart sensitivity recommendations • Gemini + Groq failover</p>
    <button id="enterBtn">ENTER</button>
  </div>
</section>

<section id="loader" class="screen hidden">
  <div>
    <div class="loader"></div>
    <h2>Initializing AI</h2>
    <p>Preparing your sensitivity assistant...</p>
  </div>
</section>

<main id="app" class="hidden">
<section class="panel">
  <p class="eyebrow">SENSITIVITY ASSISTANT</p>
  <h2>Build your setup</h2>
  <p class="hint">Give the AI your device, play style, graphics and language.</p>

  <form id="form">
    <label>Device name</label>
    <input id="device" required maxlength="100" placeholder="Example: Vivo Y22">

    <label>Player style</label>
    <select id="style">
      <option value="low">Low sensitivity / controlled</option>
      <option value="high">High sensitivity / fast</option>
    </select>

    <label>Graphics</label>
    <select id="graphics">
      <option value="smooth">Smooth</option>
      <option value="standard">Standard</option>
      <option value="ultra">Ultra</option>
      <option value="max">Max</option>
    </select>

    <label>Reply language</label>
    <input id="language" maxlength="40" value="English" placeholder="English / Tamil / Thanglish">

    <button id="askBtn" type="submit">GET AI SENSITIVITY</button>
  </form>

  <div id="status" class="status"></div>
  <article id="result" class="result hidden"></article>
</section>
</main>
<script src="app.js"></script>
</body>
</html>
