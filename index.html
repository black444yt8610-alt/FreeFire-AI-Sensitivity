<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FreeFire AI Sensitivity</title><link rel="stylesheet" href="style.css">
</head>
<body>
<section id="intro" class="screen">
  <div class="orb"></div><div class="content">
    <p class="eyebrow">AI SENSITIVITY LAB</p><h1>FreeFire AI</h1>
    <p class="sub">Personalized sensitivity recommendations powered by Gemini.</p>
    <button id="enterBtn">ENTER</button>
  </div>
</section>
<section id="loader" class="screen hidden"><div><div class="loader"></div><h2>Initializing AI</h2><p>Loading your sensitivity assistant...</p></div></section>
<main id="app" class="hidden"><section class="panel">
  <p class="eyebrow">GEMINI SENSITIVITY AI</p><h2>Find your settings</h2>
  <p class="hint">Device / player style / graphics → AI recommendation</p>
  <form id="form">
    <input id="device" required maxlength="100" placeholder="Device name (e.g. Vivo Y22)">
    <select id="style"><option value="low">Low sensitivity player</option><option value="high">High sensitivity player</option></select>
    <select id="graphics"><option value="smooth">Smooth graphics</option><option value="standard">Standard graphics</option><option value="ultra">Ultra graphics</option><option value="max">Max graphics</option></select>
    <input id="language" maxlength="40" value="English" placeholder="Reply language (e.g. Tamil)">
    <button id="askBtn" type="submit">GET AI SENSITIVITY</button>
  </form>
  <div id="status" class="status"></div><article id="result" class="result hidden"></article>
</section></main>
<script src="app.js"></script>
</body></html>
